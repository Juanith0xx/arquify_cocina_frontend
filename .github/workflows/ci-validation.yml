name: CI - Arquify Validation

on:
  pull_request:
    branches:
      - main
      - staging/arquify-colaboracion
  push:
    branches:
      - main
      - staging/arquify-colaboracion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Frontend / TypeScript / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Vite build
        run: npm run build
